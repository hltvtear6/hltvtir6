<title>HLTV TIR 6 — Рейтинг команд CS2 Tier 6</title>
<style>
:root{color-scheme:dark;--bg:#0b0d11;--sf:#12161d;--sf2:#1a2029;--bd:#242c38;--tx:#eef2f7;--mu:#8b97a8;--ac:#348bdc;--up:#3ddc84;--dn:#ff5a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.w{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.nav{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.logo img{width:34px;height:34px;border-radius:8px}
.logo b{color:var(--ac)}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav a{padding:8px 12px;border-radius:8px;color:var(--mu);font-weight:600;white-space:nowrap}
nav a:hover,nav a.on{color:var(--tx);background:var(--sf2)}
.tg{background:var(--ac);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;white-space:nowrap}
.hero{padding:34px 0 10px}
h1{font-size:30px;margin:0 0 6px;line-height:1.15}
h1 span{color:var(--ac)}
.sub{color:var(--mu);margin:0 0 18px}
h2{font-size:18px;margin:26px 0 12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu)}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card.c1{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.big{font-size:34px;font-weight:800;color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--ac);background:var(--sf2)}
.pos{width:34px;font-weight:800;font-size:18px;color:var(--mu)}
.nm{font-weight:700;flex:1;min-width:0}
.pl{display:block;color:var(--mu);font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-weight:700;width:60px;text-align:right}
.ch{width:44px;text-align:right;font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}.eq{color:var(--mu)}
.badge{display:inline-flex;width:38px;height:38px;border-radius:9px;background:var(--sf2);border:1px solid var(--bd);align-items:center;justify-content:center;font-weight:800;color:var(--ac);flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.st div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}
.st small{color:var(--mu);display:block;font-size:12px;text-transform:uppercase}
.st b{font-size:22px}
.bar{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac)}
input{width:100%;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.note{background:var(--sf);border-left:3px solid var(--ac);padding:10px 14px;border-radius:6px;color:var(--mu);font-size:13px;margin-top:18px}
.cta{background:linear-gradient(135deg,#1c4f86,#348bdc);border-radius:14px;padding:22px;margin:30px 0;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta a{background:#fff;color:#0b3d70;padding:11px 20px;border-radius:9px;font-weight:800}
footer{border-top:1px solid var(--bd);color:var(--mu);padding:22px 0 30px;font-size:13px;margin-top:30px}
.back{color:var(--ac);font-weight:600;display:inline-block;margin:18px 0 4px}
@media(max-width:640px){.top3{grid-template-columns:1fr}.nav{flex-wrap:wrap;height:auto;padding:8px 0}nav{order:3;width:100%;margin:0}h1{font-size:25px}.tg{margin-left:auto}}
.ar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.ar input{margin:0;flex:1;min-width:80px;width:auto}
textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:10px;font:inherit}
button,.btn{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.x{color:var(--dn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;align-items:center}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bi{width:38px;height:38px;object-fit:contain;border-radius:8px}.badge .bi{width:100%;height:100%;padding:3px;border-radius:0}.badge{overflow:hidden}.badge.bg{width:64px;height:64px;font-size:22px}
.abar{padding:8px 0;background:#16324f;color:#cfe6ff;font-size:13px}.abar a{color:#fff;font-weight:700;text-decoration:underline}label small{color:var(--mu);display:block;margin-bottom:4px}
.row.ro{cursor:default}.row.ro:hover{border-color:var(--bd);background:var(--sf)}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:8px}
.nc{display:block;padding:0;overflow:hidden}.nc:hover{border-color:var(--ac)}.nc img{width:100%;height:190px;object-fit:cover;object-position:top;display:block}.nb{padding:12px 14px}.nc b{display:block;margin:4px 0}
.nt{color:var(--mu);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{background:var(--ac);color:#fff;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;text-transform:uppercase}
.nimg{width:100%;max-height:520px;object-fit:contain;border-radius:10px;display:block}

<script>
function E(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function h(s){var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return(x>>>0).toString(36)}
function H(s){s='t6:'+s;return h(s)+h(s+'~')+h(s.split('').reverse().join(''))}
function rnd(s,a,b){return a+(parseInt(h(s),36)%1000)/1000*(b-a)}
var DB=JSON.parse(E('db').textContent),ADM=false,AT='teams',T,P;
var BH=h(E('db').textContent);function ld(){try{var o=JSON.parse(localStorage.getItem('tir6db'));if(o&&o.b==BH&&o.d)return o.d}catch(e){}return null}
try{ADM=sessionStorage.getItem('tir6adm')=='1';var dr=ld();if(ADM&&dr)DB=dr}catch(e){}
function save(){try{localStorage.setItem('tir6db',JSON.stringify({b:BH,d:DB}))}catch(e){}}
function build(){DB.news=DB.news||[];T=DB.teams.map(function(t,i){return{i:i,n:t.n,p:t.p,c:t.c,l:t.l,pl:t.pl}});P=[];T.forEach(function(t){t.pl.forEach(function(n){P.push({n:n,t:t.i})})})}
function site(){var s=DB.site;E('lg').src=s.logo;E('bn').innerHTML=esc(s.b1)+' <b>'+esc(s.b2)+'</b>';E('tgb').href=s.tg;
E('ft').innerHTML='© '+esc(s.foot)+' · <a href="'+esc(s.tg)+'" target="_blank" rel="noopener" style="color:var(--ac)">'+esc(s.tg.replace('https://',''))+'</a>';
E('ab').innerHTML=ADM?'<div class="abar"><div class="w">Режим админа · <a href="#/admin">Панель</a> · <a href="#/" onclick="out()">Выйти</a></div></div>':'';
document.title=s.b1+' '+s.b2+' — '+s.h1a+' '+s.h1b}
function demo(p){var k=p.n;return{r:rnd(k+"r",.88,1.28),kd:rnd(k+"k",.85,1.4),hs:rnd(k+"h",32,66),ka:rnd(k+"a",62,79),adr:rnd(k+"d",58,88),m:Math.round(rnd(k+"m",18,64))}}
function stats(p){var o=DB.stats[p.n]||{},d=demo(p),s={real:false};["r","kd","hs","ka","adr","m"].forEach(function(k){if(o[k]!==undefined&&o[k]!==""&&!isNaN(+o[k])){s[k]=+o[k];s.real=true}else s[k]=d[k]});return s}
function chg(c){return c>0?'<span class="ch up">▲ '+c+'</span>':c<0?'<span class="ch dn">▼ '+(-c)+'</span>':'<span class="ch eq">—</span>'}
function ini(n){return esc(n.replace(/[^A-Za-zА-Яа-я0-9]/g,"").slice(0,2).toUpperCase())}
function bd(t,big){return'<span class="badge'+(big?' bg':'')+'">'+(t.l?'<img class="bi" src="'+esc(t.l)+'" alt="">':ini(t.n))+'</span>'}
function trow(t){return'<a class="row" href="#/team/'+t.i+'"><span class="pos">#'+(t.i+1)+'</span>'+bd(t)+'<span class="nm">'+esc(t.n)+'<span class="pl">'+esc(t.pl.join(" · ")||"состав уточняется")+'</span></span><span class="pts">'+t.p+'</span>'+chg(t.c)+'</a>'}
function prow(p){var s=stats(p);return'<a class="row" href="#/player/'+encodeURIComponent(p.n)+'"><span class="badge">'+ini(p.n)+'</span><span class="nm">'+esc(p.n)+'<span class="pl">'+esc(T[p.t].n)+'</span></span><span class="pts">'+s.r.toFixed(2)+'</span></a>'}
function cta(t,b){return'<div class="cta"><div><b style="font-size:18px">'+t+'</b></div><a href="'+esc(DB.site.tg)+'" target="_blank" rel="noopener">'+b+'</a></div>'}
var V={
home:function(){var s=DB.site,t3=T.slice(0,3).map(function(t,i){return'<a class="card'+(i?'':' c1')+'" href="#/team/'+t.i+'" style="display:block"><div class="pos">#'+(i+1)+'</div><div class="big">'+t.p+'</div><b>'+esc(t.n)+'</b><span class="pl">'+esc(t.pl.join(" · ")||"состав уточняется")+'</span></a>'}).join("");
return'<section class="hero"><h1>'+esc(s.h1a)+' <span>'+esc(s.h1b)+'</span></h1><p class="sub">'+esc(s.sub)+'</p></section><div class="top3">'+t3+'</div>'+nblock()+'<h2>Полный рейтинг</h2>'+T.map(trow).join("")+cta("Новости и результаты — в Telegram","Подписаться")},
teams:function(){return'<h2>Команды</h2><input id="q" placeholder="Поиск команды..."><div id="l">'+T.map(trow).join("")+'</div>'},
players:function(){return'<h2>Игроки</h2><input id="q" placeholder="Поиск игрока или команды..."><div id="l">'+P.map(prow).join("")+'</div>'},
team:function(a){var t=T[a];if(!t)return V.nf();var pr=P.filter(function(p){return p.t==t.i}),tr=pr.reduce(function(s,p){return s+stats(p).r},0)/(pr.length||1);
return'<a class="back" href="#/teams">← Все команды</a><section class="hero" style="padding-top:8px"><div style="display:flex;gap:14px;align-items:center">'+bd(t,1)+'<div><h1 style="margin:0">'+esc(t.n)+'</h1><span class="sub">Место в рейтинге: #'+(t.i+1)+'</span></div></div></section><div class="st"><div><small>Очки</small><b>'+t.p+'</b></div><div><small>Позиция</small><b>#'+(t.i+1)+'</b></div><div><small>Изменение</small><b class="'+(t.c>0?'up':t.c<0?'dn':'eq')+'">'+(t.c>0?'+':'')+t.c+'</b></div></div><h2>Состав</h2>'+(pr.map(function(p){return'<div class="row ro"><span class="badge">'+ini(p.n)+'</span><span class="nm">'+esc(p.n)+'</span></div>'}).join("")||'<div class="note">Состав пока не указан.</div>')},
player:function(a){var n=decodeURIComponent(a),p=P.filter(function(x){return x.n==n})[0];if(!p)return V.nf();var s=stats(p),t=T[p.t];
function bar(l,v,mx,f){return'<div style="display:flex;justify-content:space-between"><span>'+l+'</span><b>'+f+'</b></div><div class="bar"><i style="width:'+Math.min(100,v/mx*100)+'%"></i></div>'}
